<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel standardization</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/style.css?v={{ v_css }}">
</head>
<body>
    <!-- Error Banner -->
    <div id="error-banner" class="error-banner hidden" role="alert">
        <span id="error-message"></span>
        <button class="dismiss-btn" onclick="dismissError()" aria-label="סגור הודעת שגיאה">✕</button>
    </div>

    <div class="container">
        <header>
            <h1>תקן קבצי Excel</h1>
            <p class="subtitle">העלה קובץ, תקן ערכים, ערוך וייצא בתוצרים מסודרים</p>
        </header>

        <!-- Upload Section -->
        <section id="upload-section" class="card">
            <h2>העלה קובץ Excel</h2>
            <form id="upload-form">
                <div class="file-input-wrapper">
                    <input
                        type="file"
                        id="file-input"
                        accept=".xlsx,.xlsm,.xls"
                        multiple
                        required
                        aria-label="בחר קבצי Excel"
                    >
                    <label for="file-input" class="file-label">
                        בחר קבצים ב-Excel (.xlsx, .xlsm, .xls)
                    </label>
                </div>
                <button type="submit" id="upload-btn" class="btn btn-primary">
                    העלה
                </button>
            </form>
            <div id="upload-status" class="status-message"></div>
        </section>

        <!-- Session Switcher — always shown once any file is loaded -->
        <section id="session-switcher" class="card hidden">
            <h2>קבצים פתוחים</h2>
            <div id="session-tabs" class="sheet-tabs" role="tablist"></div>
        </section>

        <!-- Sheet Selector -->
        <section id="sheet-selector" class="card hidden">
            <h2>בחירת גיליון</h2>
            <div id="sheet-tabs" class="sheet-tabs" role="tablist"></div>
        </section>

        <!-- Action Bar -->
        <div id="action-bar" class="action-bar hidden">
            <!-- Institution bar: workbook-level MosadID / MosadType / MosadName -->
            <div id="institution-bar" class="institution-bar">
                <div class="institution-group">
                    <label class="institution-label" for="inst-id">מספר מוסד</label>
                    <input id="inst-id" class="inst-input" type="text" placeholder="123" title="מספר מוסד" />
                </div>
                <div class="institution-group">
                    <label class="institution-label" for="inst-name">שם מוסד</label>
                    <input id="inst-name" class="inst-input inst-name" type="text" placeholder="שם המוסד" title="שם מוסד" />
                </div>
                <div class="institution-group institution-type-group">
                    <label class="institution-label" for="inst-type-1">סוג מוסד</label>
                    <input id="inst-type-1" class="inst-input inst-type-input" type="text" placeholder="סוג מוסד" title="ערך סוג מוסד (ברירת מחדל)" />
                    <input id="inst-type-2" class="inst-input inst-type-input secondary-type" type="text" placeholder="סוג 2" title="ערך סוג מוסד 2" />
                    <input id="inst-type-3" class="inst-input inst-type-input secondary-type" type="text" placeholder="סוג 3" title="ערך סוג מוסד 3" />
                </div>
                <div class="institution-group">
                    <label class="institution-label" for="inst-type-apply-select">בחר סוג</label>
                    <select id="inst-type-apply-select" class="inst-select inst-type-apply-select" title="בחר ערך להחלה"></select>
                </div>
                <div class="institution-group">
                    <label class="institution-label" for="inst-scope-select">היקף</label>
                    <select id="inst-scope-select" class="inst-select" title="בחר היקף החלה" onchange="onScopeChange()">
                        <option value="workbook">כל הגיליונות</option>
                        <option value="sheet">גיליון נבחר</option>
                        <option value="selected_rows">שורות נבחרות</option>
                    </select>
                </div>
                <div class="institution-group inst-scope-extras">
                    <select id="inst-sheet-select" class="inst-select inst-sheet-select hidden" title="בחר גיליון"></select>
                    <span id="inst-selected-rows-hint" class="inst-selected-rows-hint hidden">סמן שורות בטבלה ולחץ 'החל סוג'</span>
                </div>
                <button class="btn btn-sm btn-outline" onclick="applyMosadTypeScoped()" title="החל את סוג המוסד לפי האפשרויות שנבחרו">החל סוג</button>
            </div>
            <div class="action-buttons">
            <button id="normalize-btn" class="btn btn-success" onclick="runstandardization()" title="הרצת סטנדרטיזציה (Ctrl+Enter)" aria-label="הרצת סטנדרטיזציה (Ctrl+Enter)">
                ▶ הרצת סטנדרטיזציה
                <span class="shortcut-hint">Ctrl+Enter</span>
            </button>
            <button id="delete-rows-btn" class="btn btn-danger" onclick="deleteSelectedRows()" disabled title="בחר שורות כדי למחוק (Delete)" aria-label="בחר שורות כדי למחוק (Delete)">
                🗑 מחיקת שורות
                <span class="shortcut-hint">Delete</span>
            </button>
            <button id="clear-all-filters-btn" class="btn btn-filter-clear hidden" onclick="clearAllFilters()">
                ✕ נקה סינונים
            </button>

            <button id="export-btn" class="btn btn-secondary" onclick="exportWorkbook()" title="ייצוא קובץ (Ctrl+S)" aria-label="ייצוא קובץ (Ctrl+S)">
                ⬇ ייצוא קובץ
                <span class="shortcut-hint">Ctrl+S</span>
            </button>
            <button id="export-sheet-btn" class="btn btn-secondary" onclick="exportCurrentSheet()" title="ייצוא גיליון (Ctrl+Shift+E)" aria-label="ייצוא גיליון (Ctrl+Shift+E)">
                ייצוא גיליון
                <span class="shortcut-hint">Ctrl+Shift+E</span>
            </button>
            <button id="undo-edit-btn" class="btn btn-secondary" onclick="undoLastGridEdit()" disabled title="אין שינוי לביטול (Ctrl+Z)" aria-label="אין שינוי לביטול (Ctrl+Z)">
                בטל שינוי אחרון
                <span class="shortcut-hint">Ctrl+Z</span>
            </button>
            <button id="report-preview-btn" class="btn btn-secondary" onclick="openProcessingReportPreview()">
                דוח
            </button>
            </div>
        </div>

        <!-- Processing Report -->
        <section id="processing-report-section" class="card report-card hidden">
            <div class="report-header">
                <h2>&#1491;&#1493;&#1495; &#1506;&#1497;&#1489;&#1493;&#1491;</h2>
                <span id="report-status" class="report-status"></span>
            </div>
            <div id="report-summary" class="report-summary"></div>
            <div id="report-details" class="report-details"></div>
        </section>

        <div id="processing-report-modal" class="report-modal hidden" role="dialog" aria-modal="true" aria-label="דוח עיבוד">
            <div class="report-modal-panel">
                <div class="report-modal-header">
                    <h2>דוח עיבוד</h2>
                    <div class="report-modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="downloadProcessingReport()">ייצוא דוח</button>
                        <button type="button" class="btn btn-secondary" onclick="closeProcessingReportPreview()">סגור</button>
                    </div>
                </div>
                <div id="processing-report-preview" class="report-preview"></div>
            </div>
        </div>

        <!-- Grid Section -->
        <section id="grid-section" class="card hidden">
            <div class="grid-section-header">
                <h2 id="grid-title"></h2>
                <button id="expand-grid-btn" class="btn-expand-grid" onclick="openGridOverlay()" title="הגדל טבלה למסך מלא">⛶ הגדל טבלה</button>
            </div>
            <div id="multi-edit-bar" class="multi-edit-bar hidden">
                <span id="multi-edit-text"></span>
                <button type="button" class="btn btn-sm btn-outline" onclick="clearRowSelection()" title="נקה בחירה (Esc)" aria-label="נקה בחירה (Esc)">נקה בחירה <span class="shortcut-hint">Esc</span></button>
            </div>
            <div id="grid-stats" class="grid-stats"></div>
            <div id="grid-container" class="grid-container"></div>
        </section>
    </div>

    <!-- Full-screen grid overlay -->
    <div id="grid-overlay" class="grid-overlay hidden" role="dialog" aria-modal="true" aria-label="טבלה במסך מלא">
        <div class="grid-overlay-bar">
            <span id="grid-overlay-title" class="grid-overlay-title"></span>
            <span id="grid-overlay-stats" class="grid-overlay-stats"></span>
            <button class="btn-overlay-close" onclick="closeGridOverlay()" title="סגור מסך מלא (Esc)">✕ סגור <span class="shortcut-hint">Esc</span></button>
        </div>
        <div id="grid-overlay-container" class="grid-overlay-container"></div>
    </div>

    <script src="/static/js/state.js?v={{ v_state_js }}"></script>
    <script src="/static/js/api.js?v={{ v_api_js }}"></script>
    <script src="/static/js/report.js?v={{ v_report_js }}"></script>
    <script src="/static/js/grid.js?v={{ v_grid_js }}"></script>
    <script src="/static/js/edit.js?v={{ v_edit_js }}"></script>
    <script src="/static/js/column_mapping.js?v={{ v_column_mapping_js }}"></script>
    <script src="/static/js/upload.js?v={{ v_upload_js }}"></script>
    <script src="/static/js/export.js?v={{ v_export_js }}"></script>
    <script src="/static/app.js?v={{ v_js }}"></script>
</body>
</html>
