<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Management</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }
        main {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }
        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 28px; line-height: 1.15; }
        h2 { margin: 0 0 14px; font-size: 18px; }
        .version { color: #607080; font-size: 13px; }
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr);
            gap: 16px;
        }
        .panel {
            background: #fff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 18px;
        }
        .toolbar, .button-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar { justify-content: space-between; margin-bottom: 14px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 11px 10px;
            border-bottom: 1px solid #e6edf3;
            text-align: left;
            vertical-align: top;
        }
        th {
            color: #52616f;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0;
            background: #f8fafc;
        }
        tr:last-child td { border-bottom: 0; }
        .status {
            display: inline-flex;
            align-items: center;
            min-width: 76px;
            justify-content: center;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .status.enabled { background: #dff7e8; color: #176b3a; }
        .status.disabled { background: #fde8e8; color: #9b1c1c; }
        label {
            display: block;
            margin: 0 0 6px;
            color: #52616f;
            font-size: 13px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            min-height: 40px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            padding: 8px 10px;
            font: inherit;
            background: #fff;
        }
        .field { margin-bottom: 14px; }
        button {
            min-height: 40px;
            border: 0;
            border-radius: 6px;
            padding: 9px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            background: #2f80ed;
            color: #fff;
        }
        button.secondary { background: #52616f; }
        button.danger { background: #c2410c; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .message {
            min-height: 22px;
            margin-top: 12px;
            font-size: 13px;
            color: #52616f;
        }
        .message.error { color: #b42318; }
        .stack {
            display: grid;
            gap: 16px;
        }
        @media (max-width: 840px) {
            header { align-items: flex-start; flex-direction: column; }
            .layout { grid-template-columns: 1fr; }
            table { font-size: 13px; }
            th:nth-child(4), td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Engine Management</h1>
            <div class="version" id="config-version">Configuration version: loading</div>
        </div>
        <button class="secondary" type="button" onclick="reloadConfig()">Reload Configuration</button>
    </header>

    <section class="layout">
        <div class="panel">
            <div class="toolbar">
                <h2>Registered Engines</h2>
                <button class="secondary" type="button" onclick="getEngines()">Refresh</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>Engine</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Version</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody id="engines-list"></tbody>
            </table>
        </div>

        <div class="stack">
            <section class="panel">
                <h2>Activation</h2>
                <div class="field">
                    <label for="engine-name">Engine</label>
                    <select id="engine-name"></select>
                </div>
                <div class="button-row">
                    <button type="button" onclick="enableEngine()">Enable</button>
                    <button class="danger" type="button" onclick="disableEngine()">Disable</button>
                </div>
            </section>

            <section class="panel">
                <h2>Add Engine</h2>
                <div class="field">
                    <label for="new-engine-name">Engine Key</label>
                    <input type="text" id="new-engine-name" placeholder="location">
                </div>
                <div class="field">
                    <label for="new-engine-class">Class Path</label>
                    <input type="text" id="new-engine-class"
                           placeholder="src.excel_standardization.engine_management.PassthroughEngine">
                </div>
                <div class="button-row">
                    <button type="button" onclick="addEngine()">Add Engine</button>
                </div>
                <div class="message" id="message"></div>
            </section>
        </div>
    </section>
</main>

<script>
    const writeHeaders = {
        "Content-Type": "application/json",
        "X-Engine-Role": "system_admin",
        "X-Engine-User": "engine-ui"
    };
    const operateHeaders = {
        "X-Engine-Role": "operator",
        "X-Engine-User": "engine-ui"
    };

    function setMessage(text, isError = false) {
        const message = document.getElementById("message");
        message.textContent = text || "";
        message.className = isError ? "message error" : "message";
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        return data;
    }

    function normalizeEngines(data) {
        if (Array.isArray(data.engines)) {
            return data.engines;
        }
        return Object.entries(data.engines || data).map(([engine_key, value]) => ({
            engine_key,
            ...value
        }));
    }

    async function getEngines() {
        setMessage("");
        try {
            const data = await requestJson("/api/engines");
            const engines = normalizeEngines(data);
            const enginesList = document.getElementById("engines-list");
            const engineSelect = document.getElementById("engine-name");
            document.getElementById("config-version").textContent =
                `Configuration version: ${data.config_version || "unversioned"}`;

            enginesList.innerHTML = "";
            engineSelect.innerHTML = "";

            for (const engine of engines) {
                const key = engine.engine_key;
                const row = document.createElement("tr");
                const nameCell = document.createElement("td");
                const strong = document.createElement("strong");
                strong.textContent = key;
                nameCell.appendChild(strong);
                nameCell.appendChild(document.createElement("br"));
                nameCell.append(document.createTextNode(engine.display_name || ""));

                const statusCell = document.createElement("td");
                const status = document.createElement("span");
                status.className = `status ${engine.enabled ? "enabled" : "disabled"}`;
                status.textContent = engine.enabled ? "Enabled" : "Disabled";
                statusCell.appendChild(status);

                const priorityCell = document.createElement("td");
                priorityCell.textContent = engine.priority ?? "";
                const versionCell = document.createElement("td");
                versionCell.textContent = engine.version || "";
                const descriptionCell = document.createElement("td");
                descriptionCell.textContent = engine.description || "";

                row.append(nameCell, statusCell, priorityCell, versionCell, descriptionCell);
                enginesList.appendChild(row);

                const option = document.createElement("option");
                option.value = key;
                option.textContent = `${key} (${engine.enabled ? "enabled" : "disabled"})`;
                engineSelect.appendChild(option);
            }
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    async function enableEngine() {
        const engineName = document.getElementById("engine-name").value;
        if (!engineName) return;
        try {
            await requestJson(`/api/engines/${encodeURIComponent(engineName)}/enable`, {
                method: "POST",
                headers: writeHeaders
            });
            setMessage(`Engine ${engineName} enabled.`);
            await getEngines();
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    async function disableEngine() {
        const engineName = document.getElementById("engine-name").value;
        if (!engineName) return;
        try {
            await requestJson(`/api/engines/${encodeURIComponent(engineName)}/disable`, {
                method: "POST",
                headers: writeHeaders
            });
            setMessage(`Engine ${engineName} disabled.`);
            await getEngines();
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    async function addEngine() {
        const engineName = document.getElementById("new-engine-name").value.trim();
        const classPath = document.getElementById("new-engine-class").value.trim();
        if (!engineName) {
            setMessage("Engine key is required.", true);
            return;
        }
        const body = {
            engine_key: engineName,
            enabled: true,
            priority: 1000,
            run_mode: "sequential",
            on_error: "continue"
        };
        if (classPath) {
            body.class = classPath;
        }
        try {
            await requestJson("/api/engines", {
                method: "POST",
                headers: writeHeaders,
                body: JSON.stringify(body)
            });
            document.getElementById("new-engine-name").value = "";
            setMessage(`Engine ${engineName} added.`);
            await getEngines();
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    async function reloadConfig() {
        try {
            await requestJson("/api/engines/reload", {
                method: "POST",
                headers: operateHeaders
            });
            setMessage("Configuration reloaded.");
            await getEngines();
        } catch (error) {
            setMessage(error.message, true);
        }
    }

    window.addEventListener("load", getEngines);
</script>
</body>
</html>
